<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example report · Scout</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    @font-face { font-family: "Charis SIL"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/charis-sil-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Charis SIL"; font-weight: 400; font-style: italic; font-display: swap; src: url("/fonts/charis-sil-latin-400-italic.woff2") format("woff2"); }
    @font-face { font-family: "Charis SIL"; font-weight: 700; font-style: normal; font-display: swap; src: url("/fonts/charis-sil-latin-700-normal.woff2") format("woff2"); }
    :root { --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e0d8; --paper: #faf6ee; --accent: #174f49; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ecebe6; --muted: #a3a29b; --line: #34332f; --paper: #0f1f1d; --accent: #9cd2c7; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
           font: 17px/1.6 "Charis SIL", Charter, Georgia, serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
    a { color: var(--accent); }
    .back { margin: 0 0 24px; font: 14px system-ui, sans-serif; }
    .eyebrow { margin: 0 0 6px; font: 600 13px system-ui, sans-serif; text-transform: uppercase;
               letter-spacing: 1px; color: var(--muted); }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.5px; }
    .meta { color: var(--muted); font: 14px/1.5 system-ui, sans-serif; margin: 0 0 24px; }
    details { margin: 0 0 24px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; }
    summary { cursor: pointer; font: 600 14px system-ui, sans-serif; }
    #progress { margin: 12px 0 0; padding-left: 22px; font: 14px/1.5 system-ui, sans-serif; color: var(--muted); }
    #report { border-top: 1px solid var(--line); padding-top: 8px; }
    .cta { margin-top: 40px; font: 600 16px system-ui, sans-serif; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <p class="back"><a href="/">← About the book</a></p>
  <p class="eyebrow">Example report</p>
  <h1 id="question">Loading the report…</h1>
  <p class="meta" id="meta"></p>
  <details open id="steps" hidden>
    <summary>How Scout worked on this</summary>
    <ol id="progress"></ol>
  </details>
  <article id="report"></article>
  <p class="cta"><a href="/demo">Ask Scout your own question →</a></p>
</main>

<script>
  // This page only reads a saved report. It never asks Claude anything.
  const $ = (id) => document.getElementById(id);
  const escape = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const name = location.pathname.split("/").filter(Boolean).pop();

  function show(example) {
    document.title = `${example.question} · Scout`;
    $("question").textContent = example.question;
    const made = example.made_at ? new Date(example.made_at).toLocaleDateString("en-GB",
      { day: "numeric", month: "long", year: "numeric" }) : "";
    const s = example.settings || {};
    $("meta").textContent = `Researched by Scout${made ? " on " + made : ""}, with the live demo's settings` +
      (s.max_subtasks ? `: up to ${s.max_subtasks} researchers, ${s.max_searches_per_researcher} searches each.` : ".");
    $("progress").innerHTML = (example.progress || []).map((p) => `<li>${escape(p)}</li>`).join("");
    $("steps").hidden = !(example.progress || []).length;
    const report = example.report || "";
    $("report").innerHTML = window.marked && window.DOMPurify
      ? DOMPurify.sanitize(marked.parse(report))
      : `<pre style="white-space: pre-wrap; font: inherit">${escape(report)}</pre>`;  // if the library didn't load
  }

  fetch(`/api/examples/${encodeURIComponent(name)}`)
    .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
    .then(show)
    .catch(() => {
      $("question").textContent = "This example report isn't available right now.";
      $("meta").textContent = "Please try again later, or ask Scout your own question.";
    });
</script>
</body>
</html>
