<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Scout</title>
  <style>
    :root { --ink: #1d1d1b; --muted: #6b6b66; --paper: #fbfaf6; --accent: #2f5d50; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --muted: #a3a29b; --paper: #191917; --accent: #7fb8a4; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 Georgia, "Iowan Old Style", serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 30px; margin: 0 0 12px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There's no page at this address. It may have moved, or the link may have a typo.</p>
  <p><a href="/">Go to the book's website</a> or <a href="/demo">try Scout</a>.</p>
</main>
</body>
</html>
