<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    :root { --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e0d8; --paper: #fbfaf6; --accent: #2f5d50; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ecebe6; --muted: #a3a29b; --line: #34332f; --paper: #191917; --accent: #7fb8a4; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
           font: 17px/1.6 Georgia, "Iowan Old Style", serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
    h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -0.5px; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    textarea { width: 100%; min-height: 96px; padding: 12px; font: inherit; color: inherit;
               background: transparent; border: 1px solid var(--line); border-radius: 8px; }
    button { margin-top: 10px; padding: 10px 18px; font: 600 15px system-ui, sans-serif;
             color: var(--paper); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #progress { list-style: none; padding: 0; margin: 24px 0; font: 14px/1.5 system-ui, sans-serif; color: var(--muted); }
    #progress li::before { content: "› "; color: var(--accent); }
    #report { border-top: 1px solid var(--line); padding-top: 8px; }
    #report a { color: var(--accent); }
    .error { color: #b3261e; font-family: system-ui, sans-serif; }
    h2.small { font: 600 13px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 1px;
               color: var(--muted); margin-top: 48px; }
    #history { padding-left: 18px; font-size: 15px; }
    #history a { color: inherit; }
  </style>
</head>
<body>
<main>
  <h1>Scout</h1>
  <p class="lede">Ask a question. A team of research agents will search the web and write you a cited answer.</p>

  <form id="ask">
    <textarea id="question" placeholder="For example: How do heat pumps compare with gas boilers on running costs in the UK?" required></textarea>
    <button id="go" type="submit">Research it</button>
  </form>

  <ul id="progress"></ul>
  <article id="report"></article>

  <h2 class="small">Recent questions</h2>
  <ol id="history"></ol>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let timer = null;

  async function api(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
    return data;
  }

  function show(job) {
    $("progress").innerHTML = job.progress.map((p) => `<li>${p.replace(/</g, "&lt;")}</li>`).join("");
    if (job.status === "done") {
      $("report").innerHTML = DOMPurify.sanitize(marked.parse(job.report));
    } else if (job.status === "failed") {
      $("report").innerHTML = `<p class="error">Something went wrong: ${job.error.replace(/</g, "&lt;")}</p>`;
    } else {
      $("report").innerHTML = "<p><em>Researching… this usually takes one to four minutes.</em></p>";
    }
  }

  async function follow(id) {
    clearInterval(timer);
    const tick = async () => {
      const job = await api(`/api/research/${id}`);
      show(job);
      if (job.status !== "running") {
        clearInterval(timer);
        $("go").disabled = false;
        loadHistory();
      }
    };
    await tick();
    timer = setInterval(tick, 2000);
  }

  async function loadHistory() {
    const jobs = await api("/api/history");
    $("history").innerHTML = jobs.map((j) =>
      `<li><a href="#${j.id}">${j.question.replace(/</g, "&lt;")}</a> <small>(${j.status})</small></li>`).join("");
  }

  $("ask").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("go").disabled = true;
    $("progress").innerHTML = "";
    try {
      const { id } = await api("/api/research", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: $("question").value }),
      });
      location.hash = id;
    } catch (err) {
      $("report").innerHTML = `<p class="error">${err.message}</p>`;
      $("go").disabled = false;
    }
  });

  window.addEventListener("hashchange", () => location.hash && follow(location.hash.slice(1)));
  if (location.hash) follow(location.hash.slice(1));
  loadHistory();
</script>
</body>
</html>
